name: PR → Issue Linker (smart)

on:
  workflow_call:
    secrets:
      CROSS_REPO_TOKEN:
        required: true

jobs:
  link:
    runs-on: ubuntu-latest

    steps:
      - name: Extract issue references
        id: extract
        run: |
          BODY="${{ github.event.pull_request.body }}"
          
          if [ -z "$BODY" ] || [ "$BODY" == "null" ]; then
            echo "[PR-Linker] ℹ️ PR body is empty"
            echo "issues=" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          ISSUES=$(echo "$BODY" | grep -Eo '([a-zA-Z0-9_.-]+\/[a-zA-Z0-9_.-]+)?#[0-9]+' | sort -u)
          echo "issues=$ISSUES" >> $GITHUB_OUTPUT

      - name: Upsert / Delete comments
        if: steps.extract.outputs.issues != ''
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          SOURCE_REPO="${{ github.repository }}"
          ACTION="${{ github.event.action }}"
          MERGED="${{ github.event.pull_request.merged }}"

          MARKER="<!-- pr-linker:${PR_URL} -->"
          FAILED=0
          PROCESSED=0

          while IFS= read -r ISSUE; do
            [ -z "$ISSUE" ] && continue
            
            if [[ "$ISSUE" == *"/"* ]]; then
              REPO=$(echo $ISSUE | cut -d'#' -f1)
              NUMBER=$(echo $ISSUE | cut -d'#' -f2)
            else
              REPO="$SOURCE_REPO"
              NUMBER=$(echo $ISSUE | cut -d'#' -f2)
            fi

            if ! [[ "$NUMBER" =~ ^[0-9]+$ ]]; then
              echo "Invalid issue number: $NUMBER"
              ((FAILED++))
              continue
            fi

            echo "Processing $REPO issue #$NUMBER"

            # Fetch comments with HTTP status code
            COMMENTS_RESPONSE=$(curl -s -w "\n%{http_code}" \
              -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/$REPO/issues/$NUMBER/comments)

            HTTP_CODE=$(echo "$COMMENTS_RESPONSE" | tail -n1)
            COMMENTS_BODY=$(echo "$COMMENTS_RESPONSE" | head -n-1)

            if [ "$HTTP_CODE" != "200" ]; then
              echo "Failed to fetch comments for $REPO#$NUMBER (HTTP $HTTP_CODE)"
              ((FAILED++))
              continue
            fi

            COMMENT_ID=$(echo "$COMMENTS_BODY" | jq -r \
              --arg marker "$MARKER" \
              '.[] | select(.body | contains($marker)) | .id' | head -n 1)

            BODY_TEXT="🔗 Linked PR:
Title: $PR_TITLE
URL: $PR_URL
Source: $SOURCE_REPO

$MARKER"

            # 🧹 DELETE if PR closed and NOT merged
            if [[ "$ACTION" == "closed" && "$MERGED" == "false" ]]; then
              if [ -n "$COMMENT_ID" ]; then
                echo "Deleting comment $COMMENT_ID"
                DELETE_RESPONSE=$(curl -s -w "\n%{http_code}" -X DELETE \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  https://api.github.com/repos/$REPO/issues/comments/$COMMENT_ID)
                DELETE_CODE=$(echo "$DELETE_RESPONSE" | tail -n1)
                if [[ "$DELETE_CODE" =~ ^(200|204)$ ]]; then
                  ((PROCESSED++))
                else
                  echo "Failed to delete comment (HTTP $DELETE_CODE)"
                  ((FAILED++))
                fi
              else
                echo "No comment found to delete"
              fi
              continue
            fi

            # 🔁 UPDATE if exists
            if [ -n "$COMMENT_ID" ]; then
              echo "Updating existing comment $COMMENT_ID"
              UPDATE_RESPONSE=$(curl -s -w "\n%{http_code}" -X PATCH \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/$REPO/issues/comments/$COMMENT_ID \
                -d "$(j](#)
